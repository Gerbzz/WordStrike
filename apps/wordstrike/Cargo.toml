[package]
name = "wordstrike"
version = "0.1.0"
edition = "2024"

# Kept independent while another app owns the shared workspace build slot.
[workspace]

[dependencies]
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
quick-xml = "0.41.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
uuid = { version = "=1.26.1", features = ["serde", "v4"] }
zip = { version = "9.0.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }
designcraft-doc = { path = "../../vendor/designcraft-page/crates/doc", optional = true }
designcraft-geom = { path = "../../vendor/designcraft-page/crates/geom", optional = true }
designcraft-compose = { path = "../../vendor/designcraft-page/crates/compose", optional = true }
designcraft-images = { path = "../../vendor/designcraft-page/crates/images", optional = true }
designcraft-pdf = { path = "../../vendor/designcraft-page/crates/pdf", optional = true }
eframe = { version = "=0.36.2", default-features = false, features = ["default_fonts", "glow", "accesskit", "wayland", "x11"], optional = true }

[features]
donor-export = ["dep:designcraft-doc", "dep:designcraft-geom", "dep:designcraft-compose", "dep:designcraft-images", "dep:designcraft-pdf"]
native-ui = ["donor-export", "dep:eframe"]

[[bin]]
name = "wordstrike-native"
path = "src/bin/wordstrike-native.rs"
required-features = ["native-ui"]

[dev-dependencies]
hayro-syntax = "0.7.2"
