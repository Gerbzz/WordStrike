name: Native Windows checks

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/native-windows.yml
      - apps/wordstrike/**
      - vendor/designcraft-page/**
      - fixtures/wordstrike/**
      - native/wordstrike/**
      - tests/**
      - assets/branding/**

permissions:
  contents: read

jobs:
  native:
    if: github.repository == 'Gerbzz/WordStrike'
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: native/wordstrike
        shell: pwsh
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_TARGET_DIR: '${{ github.workspace }}/native/wordstrike/target'
      WORDCRAFT_REQUIRE_WINRES: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Show Rust toolchain
        run: |
          rustc --version
          cargo --version

      - name: Select compatible Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: '1.96.1'

      - name: Test locale-number overflow regressions
        run: 'cargo test --locked -p wordcraft-doc --lib locale_number::tests::'

      - name: Test complete native document library
        run: cargo test --locked -p wordcraft-doc --lib

      - name: Test complete legacy app and recovery workflows
        working-directory: apps/wordstrike
        run: cargo test --locked --all-features -j 1

      - name: Build WordStrike desktop editor
        run: cargo build --locked -p wordcraft --bin wordstrike

      - name: Capture the real native window and title-bar branding
        working-directory: .
        env:
          WORDSTRIKE_CAPTURE_HEAD: ${{ github.event.pull_request.head.sha }}
        run: ./tests/capture-native-branding.ps1 -Executable ./native/wordstrike/target/debug/wordstrike.exe -OutputDirectory "${{ runner.temp }}/wordstrike-native-branding"

      - name: Save scoped native capture evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wordstrike-native-branding-${{ github.event.pull_request.head.sha }}
          path: |
            ${{ runner.temp }}/wordstrike-native-branding/*.png
            ${{ runner.temp }}/wordstrike-native-branding/proof.json
          if-no-files-found: warn
          retention-days: 1

      - name: Test partial table-cell margin updates
        run: cargo test --locked -p wordcraft-engine --test table_cell_margins

      - name: Test source file-access gateway
        run: cargo test --locked -p wordcraft-engine --lib commands_do_not_touch_the_file_system_themselves

      - name: Test XML save preservation
        run: cargo test --locked -p wordcraft-engine --lib word_2003

      - name: Test legacy import and safe save
        run: cargo test --locked -p wordcraft-engine --test legacy_import --test safe_save

      - name: Test legacy import UI flow
        run: cargo test --locked -p wordcraft-ui-egui --lib legacy_import

      - name: Test Save Changes UI guard
        run: cargo test --locked -p wordcraft-ui-egui --lib save_changes_waits_for_the_save_as_answer

  legacy-persistence:
    if: github.repository == 'Gerbzz/WordStrike'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select compatible Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: '1.96.1'

      - name: Test archive persistence and editable saves
        working-directory: apps/wordstrike
        run: cargo test --locked --lib --test edit -j 1
